<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background Circle (White with Slate-100 Border matching header styling) -->
  <circle cx="50" cy="50" r="47" fill="white" stroke="#E2E8F0" stroke-width="4" />
  <!-- Masked Image to clip the logo inside -->
  <mask id="circle-mask">
    <circle cx="50" cy="50" r="41" fill="white" />
  </mask>
  <image href="/aim_logo.png" x="9" y="9" width="82" height="82" mask="url(#circle-mask)" />
</svg>
